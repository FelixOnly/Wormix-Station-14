# i think we need new sprite >.<
- type: entity
  parent: [ClothingBeltStorageBase, ContentsExplosionResistanceBase]
  id: ClothingBeltNTNavyWebbing
  name: chest rig
  description:
  components:
    - type: Sprite
      sprite: _Erida/Clothing/Belt/nanotarsen_navy_webbing.rsi
    - type: Clothing
      sprite: _Erida/Clothing/Belt/nanotarsen_navy_webbing.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.1
    - type: StaticPrice
      price: 500

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseCommandContraband]
  id: ClothingBeltNTNavySheath
  name: nanotrasen navy sabre sheath
  description:
  components:
    - type: Sprite
      sprite: _Erida/Clothing/Belt/nanotarsen_navy_sheath.rsi
      state: sheath
    - type: Clothing
      sprite: _Erida/Clothing/Belt/nanotarsen_navy_sheath.rsi
    - type: Item
      size: Ginormous
    - type: ItemSlots
      slots:
        item:
          name: Sabre
          insertVerbText: sheath-insert-verb
          ejectVerbText: sheath-eject-verb
          insertSound: /Audio/Items/sheath.ogg
          ejectSound: /Audio/Items/unsheath.ogg
          whitelist:
            tags:
              - CaptainNTNavySabre
    - type: ItemMapper
      mapLayers:
        sheath-sabre:
          whitelist:
            tags:
              - CaptainNTNavySabre
    - type: Appearance

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseSyndicateContraband]
  id: ClothingBeltSheathSyndicate
  name: rapier sheath
  description: A sinister, thin sheath, suitable for a rapier.
  components:
    - type: Sprite
      sprite: _Erida/Clothing/Belt/syndie_sheath.rsi
      state: sheath
    - type: Clothing
      sprite: _Erida/Clothing/Belt/syndie_sheath.rsi
    - type: Item
      size: Ginormous
    - type: ItemSlots
      slots:
        item:
          name: rapier
          insertVerbText: sheath-insert-verb
          ejectVerbText: sheath-eject-verb
          insertSound: /Audio/Items/sheath.ogg
          ejectSound: /Audio/Items/unsheath.ogg
          whitelist:
            tags:
              - SyndicateRapier
    - type: ItemMapper
      mapLayers:
        sheath-rapier:
          whitelist:
            tags:
              - SyndicateRapier
    - type: Appearance

