- type: entity
  parent: CentcomPDA
  id: NTNavyCaptainPDA
  name: nanotrasen navy captain PDA
  components:
    - type: Pda
      id: NTNavyCaptainIDCard
    - type: Tag #  Ignore Chameleon tags
      tags:
        - DoorBumpOpener
    - type: Sprite
      sprite: _Erida/Objects/Devices/pda.rsi
      layers:
        - map: ["enum.PdaVisualLayers.Base"]
          state: "pda-nanotrasen-navy-captain"
        - state: "light_overlay"
          map: ["enum.PdaVisualLayers.Flashlight"]
          shader: "unshaded"
          visible: false
        - state: "id_overlay"
          map: ["enum.PdaVisualLayers.IdLight"]
          shader: "unshaded"
          visible: false
    - type: Appearance
      appearanceDataInit:
        enum.PdaVisuals.PdaType: !type:String pda-nanotrasen-navy-captain
    - type: PdaBorderColor
      borderColor: "#0f0f0f"
      accentHColor: "#aa6300"
      accentVColor: "#f8d860"
    - type: Icon
      sprite: _Erida/Objects/Devices/pda.rsi
      state: pda-nanotrasen-navy-captain

