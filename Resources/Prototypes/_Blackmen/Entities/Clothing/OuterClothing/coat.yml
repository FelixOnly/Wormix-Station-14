- type: entity
  parent:
    [
      ClothingOuterArmorHoS,
      ClothingOuterStorageBase,
      AllowSuitStorageClothing,
      BaseBlueShieldContraband,
    ]
  id: ClothingOuterCoatArmorBlueShield
  name: armored overcoat officer "Blueshield"
  description: An armored overcoat produced for elite Blueshield officers.
  suffix: Бакмен, ОСЩ
  components:
    - type: Sprite
      sprite: Backmen/Clothing/OuterClothing/Coats/bluecoat.rsi
    - type: Clothing
      sprite: Backmen/Clothing/OuterClothing/Coats/bluecoat.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.6
          Slash: 0.6
          Piercing: 0.6
          Heat: 0.7
    #  - type: StaminaResistance # do not add these to other equipment or mobs, we don't want to microbalance these everywhere
    #    damageCoefficient: 0.8 // убрано до баланса всего
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: GroupExamine

