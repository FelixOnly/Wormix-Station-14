- type: entity
  parent: [ClothingOuterArmorBase, AllowSuitStorageClothing]
  id: ClothingOuterArmorBlueshieldAlt
  name: officer "Blueshield"'s vest
  description: Redesigned security vest with increased protection.
  suffix: Бакмен, ОСЩ
  components:
    - type: Sprite
      sprite: Backmen/Clothing/OuterClothing/Armor/armor_blueshield.rsi
    - type: Clothing
      sprite: Backmen/Clothing/OuterClothing/Armor/armor_blueshield.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.6
          Slash: 0.6
          Piercing: 0.6
          Heat: 0.7
    - type: StaminaResistance
      damageCoefficient: 0.8
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: GroupExamine
    - type: Contraband
      allowedDepartments: [Security]
      allowedJobs: [BlueshieldOfficer]

