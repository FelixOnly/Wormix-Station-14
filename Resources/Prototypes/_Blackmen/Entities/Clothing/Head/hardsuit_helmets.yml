- type: entity
  abstract: true
  # No parent since it isn't an item
  # must parent both this and the desired helmet base when using
  id: ClothingHeadSuitWithLightBaseBackmen
  name: base hardsuit helmet with light
  categories: [HideSpawnMenu]
  components:
    # SlotBlocker blocked until UI change
    #  - type: SlotBlock
    #    slots: [ears, eyes, mask]
    - type: Sprite
      layers:
        - state: icon
        - state: icon-flash
          visible: false
          map: ["light"]
    - type: Clothing
      equippedPrefix: off
    - type: ToggleableVisuals
      spriteLayer: light
    - type: ItemTogglePointLight
    - type: PointLight
      enabled: false
      radius: 3
      energy: 2
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      netsync: false
    - type: Appearance
    - type: HandheldLight
      addPrefix: true
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
    - type: LightBehaviour
      behaviours:
        - !type:FadeBehaviour
          id: radiating
          interpolate: Linear
          maxDuration: 2.0
          startValue: 3.0
          endValue: 2.0
          isLooped: true
          reverseWhenFinished: true
        - !type:PulseBehaviour
          id: blinking
          interpolate: Nearest
          maxDuration: 1.0
          startValue: 0.1
          endValue: 2.0
          isLooped: true

- type: entity
  abstract: true
  # No parent since we aren't actually an item.
  id: ClothingHeadHardsuitBaseBackmen
  name: base hardsuit helmet
  categories: [HideSpawnMenu]
  components:
    # SlotBlocker blocked until UI change
    #  - type: SlotBlock
    #    slots: [ears, eyes, mask]
    - type: BreathMask
    - type: Sprite
      state: icon # default state used by most inheritors
    - type: Clickable
    - type: InteractionOutline
    - type: Clothing
      #Apparently the hardsuit helmet equip sound is from a walking mech?
      equipSound: /Audio/Mecha/mechmove03.ogg
      unequipSound: /Audio/Mecha/mechmove03.ogg
      quickEquip: false
      slots: [HEAD]
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.1
      coolingCoefficient: 0.1
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.90
          Slash: 0.90
          Piercing: 0.95
          Heat: 0.90
          Radiation: 0.25
    - type: GroupExamine
    - type: IngestionBlocker
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: IdentityBlocker
    - type: HideLayerClothing
      slots:
        - Hair
        - Snout
        - HeadTop
        - HeadSide
        - FacialHair
    - type: SlotBlock
      blockList: [MASK, EARS, EYES]

