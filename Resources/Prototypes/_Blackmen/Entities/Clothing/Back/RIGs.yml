- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackRIGSpecialForce
  name: EarthGov special force RIG
  description: It's a very robust RIG.
  suffix: Бакмен, ОПЗ
  components:
    - type: Sprite
      sprite: Backmen/Clothing/Back/RIGs/specialforce.rsi
    - type: ToggleableClothing
      clothingPrototype: ClothingOuterHardsuitSpecialForce
      slot: outerClothing
      requiredSlot:
        - back
    - type: Clothing
      quickEquip: false
      slots:
        - back
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: []
        toggleable-clothing: !type:Container
        cell_slot: !type:ContainerSlot
    - type: Storage
      maxItemSize: Huge
      grid:
        - 0,0,10,5

