# When adding new plushies, also add them to id: AllPlushiesTable

## Plushies
- type: entity
  parent: BasePlushie
  id: PlushieArachind
  name: arachnid plushie
  description: An adorable stuffed toy that resembles an arachnid. It feels silky..
  components:
    - type: Sprite
      sprite: Objects/Fun/Plushies/arachnid.rsi
      state: icon
    - type: EmitSoundOnUse
      sound: &PlushieArachnidSound
        path: /Audio/Voice/Arachnid/arachnid_laugh.ogg
    - type: EmitSoundOnLand
      sound: *PlushieArachnidSound
    - type: EmitSoundOnActivate
      sound: *PlushieArachnidSound
    - type: EmitSoundOnTrigger
      sound: *PlushieArachnidSound
    - type: EmitSoundOnCollide
      sound: *PlushieArachnidSound
    - type: Edible
      useSound: *PlushieArachnidSound
    - type: MeleeWeapon
      soundHit: *PlushieArachnidSound
    - type: Clothing
      quickEquip: false
      sprite: Objects/Fun/Plushies/arachnid.rsi
      slots:
        - HEAD
    - type: FoodSequenceElement
      entries:
        CottonBurger: ArachnidPlushie

- type: entity
  parent: BasePlushie
  id: PlushieHuman
  name: human plushie
  description: This is a felt plush of a human. All craftsmanship is of the lowest quality. The human is naked. The human is crying. The human is screaming.
  components:
    - type: Sprite
      sprite: Objects/Fun/Plushies/human.rsi
      state: icon
    - type: EmitSoundOnUse
      sound: &PlushieHuman1
        path: /Audio/Voice/Human/malescream_1.ogg
        params:
          volume: -8
    - type: EmitSoundOnLand
      sound:
        path: /Audio/Voice/Human/malescream_2.ogg
        params:
          volume: -8
    - type: EmitSoundOnActivate
      sound:
        path: /Audio/Voice/Human/malescream_3.ogg
        params:
          volume: -8
    - type: EmitSoundOnCollide
      sound: &PlushieHuman4
        path: /Audio/Voice/Human/malescream_4.ogg
        params:
          volume: -8
    - type: Edible
      useSound: *PlushieHuman1
    - type: MeleeWeapon
      soundHit: *PlushieHuman4
    - type: EmitSoundOnTrigger
      sound:
        path: /Audio/Voice/Human/malescream_5.ogg
        params:
          volume: -8
    - type: Clothing
      quickEquip: false
      sprite: Objects/Fun/Plushies/human.rsi
      slots:
        - HEAD
    - type: FoodSequenceElement
      entries:
        CottonBurger: HumanPlushie

- type: entity
  parent: BasePlushie
  id: PlushieVulp
  name: vulpkanin plushie
  description: An adorable stuffed toy that resembles a vulpkanin. Yip! Yap!
  components:
    - type: Sprite
      sprite: Objects/Fun/Plushies/vulp.rsi
      state: icon
    - type: EmitSoundOnUse
      sound: &PlushieVulpSound
        path: /Audio/Voice/Vulpkanin/howl.ogg
        params:
          volume: -5
    - type: EmitSoundOnLand
      sound: *PlushieVulpSound
    - type: EmitSoundOnActivate
      sound: *PlushieVulpSound
    - type: EmitSoundOnTrigger
      sound: *PlushieVulpSound
    - type: Edible
      requiresSpecialDigestion: true
      useSound:
        path: /Audio/Voice/Vulpkanin/vulp_scream4.ogg
        params:
          volume: -5
    - type: MeleeWeapon
      soundHit: *PlushieVulpSound
    - type: Clothing
      quickEquip: false
      sprite: Objects/Fun/Plushies/vulp.rsi
      slots:
        - HEAD
      clothingVisuals:
        head:
          - state: equipped-HELMET
            offset: "0, 0.0625"
    - type: FoodSequenceElement
      entries:
        CottonBurger: PlushieVulp
