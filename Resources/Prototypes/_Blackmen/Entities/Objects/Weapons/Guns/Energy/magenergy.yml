- type: entity
  name: EarthGov heavy laser rifle
  parent: BaseWeaponPowerCell
  id: WeaponEarthGovLaserSniperCell
  description: A Earth Government heavy sniper rifle for a extended combat situation.
  suffix: Бакмен, ОПЗ
  components:
    - type: Sprite
      sprite: Backmen/Objects/Weapons/Gunsx64/Battery/EG-S/big.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-unshaded-2
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Clothing
      sprite: Backmen/Objects/Weapons/Gunsx64/Battery/EG-S/tiny.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: Item
      sprite: Backmen/Objects/Weapons/Gunsx64/Battery/EG-S/tiny.rsi
    - type: GunRequiresWield
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 0.8
    - type: HeldSpeedModifier
    - type: HitscanBatteryAmmoProvider
      proto: LaserSniper
      fireCost: 100
    - type: Gun
      minAngle: 1
      maxAngle: 10
      fireRate: 1.5
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns64/EG-C/shot.ogg
    - type: MagazineVisuals
      magState: mag
      steps: 3
      zeroVisible: true
    - type: ItemSlots
      slots:
        cell_slot:
          name: Magazine
          startingItem: EnergyMag
          insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
          whitelist:
            tags:
              - EnergyMag
    - type: Wieldable
    - type: UseDelay
      delay: 2.5
