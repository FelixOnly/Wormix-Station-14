- type: entity
  name: AKMS
  parent: BaseWeaponRifle
  id: WeaponAKMSRifle
  suffix: Бакмен, ОПЗ
  description: An iconic weapon of war. Uses 7.62x39 ammo.
  components:
    - type: Sprite
      sprite: Backmen/Objects/Weapons/Gunsx64/Rifles/akms/big.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Clothing
      sprite: Backmen/Objects/Weapons/Gunsx64/Rifles/akms/tiny.rsi
    - type: Item
      sprite: Backmen/Objects/Weapons/Gunsx64/Rifles/akms/tiny.rsi
    - type: BkmGunWieldBonus
      cameraRecoilScalar: -4
    - type: GunWieldBonus
      minAngle: -23
      maxAngle: 0
      angleIncrease: -3
    - type: Gun
      angleDecay: 30
      angleIncrease: 5
      cameraRecoilScalar: 5
      minAngle: 24
      maxAngle: 35
      fireRate: 5
      soundGunshot:
        path: /Audio/Weapons/Guns64/Rifles/ak47.ogg
    - type: ChamberMagazineAmmoProvider
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineRifleLight762x39
          insertSound: /Audio/Weapons/Guns64/Rifles/ak47_reload.ogg
          ejectSound: /Audio/Weapons/Guns64/Rifles/ak47_unload.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineRifleLight762x39
        gun_chamber:
          name: Chamber
          startingItem: CartridgeRifleLight762x39
          priority: 1
          whitelist:
            tags:
              - CartridgeRifle762x39
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    - type: MagazineVisuals
      magState: mag
      steps: 1
      zeroVisible: true
    - type: Appearance
    - type: Wieldable
    - type: UseDelay
      delay: 1.3
    - type: Construction
      graph: AKMSTactical
      node: start

