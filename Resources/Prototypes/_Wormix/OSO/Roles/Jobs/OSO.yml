# Special Operations Officer

- type: job
  id: SpecialOperationsOfficer
  name: job-name-special-operations-officer
  description: job-description-operations-officer
  playTimeTracker: JobSpecialOperationsOfficer
  setPreference: false
  startingGear: SpecialOperationsOfficerGear
  icon: "JobIconOSO"
  supervisors: job-supervisors-commander
  canBeAntag: false
  requirements:
    - !type:AgeRequirement
      requiredAge: 21
  accessGroups:
    - AllAccess
  access:
    - CentralCommand
    - NanotrasenRepresentative
    - BlueshieldOfficer
  special:
    - !type:AddImplantSpecial
      implants:
        [
          MindShieldImplant,
          FreedomImplant,
          BluespaceLifelineImplant,
          RadioImplantCentcomm,
          NutrimentPumpImplant,
          StypticStimulatorImplant,
        ]

