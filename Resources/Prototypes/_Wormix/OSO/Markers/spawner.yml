# DHS Officer Spawner

- type: entity
  id: RandomHumanoidSpawnerDHSOfficer
  name: Офицер ДВБ
  suffix: Центком
  components:
    - type: Sprite
      sprite: /Textures/_Wormix/Markers/jobs.rsi
      state: navyofficer
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirstLeader
        - NamesMilitaryLast
      nameFormat: name-format-standard
    - type: RandomHumanoidSpawner
      settings: DHSOfficer

- type: randomHumanoidSettings
  id: DHSOfficer
  parent: CentcommHumanoid
  randomizeName: false
  components:
    - type: AutoImplant
      implants:
        [
          FreedomImplant,
          BluespaceLifelineImplant,
          RadioImplantCentcomm,
          StypticStimulatorImplant,
          NutrimentPumpImplant,
        ]
    - type: GhostRole
      name: ghost-role-information-navy-officer-name
      description: ghost-role-information-navy-officer-description
      rules: ghost-role-information-navy-officer-rules
      skills: # CorvaxGoob-Skills
        - All
      raffle:
        settings: short
    - type: Loadout
      prototypes: [DHSOfficerGear]
      roleLoadout: [RoleSurvivalEVA]
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirstLeader
        - NamesMilitaryLast
      nameFormat: name-format-standard

