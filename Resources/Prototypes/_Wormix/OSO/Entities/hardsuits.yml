  name: Шлем ДВБ скафандра
  description: Модификация Корпоративного Модсюта.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: /Textures/_Wormix/Clothing/corporatenavy.rsi
    - type: Armor
      traumaDeductions: # prevents traumas at all (kinda)
        Dismemberment: 1
        OrganDamage: 1
        BoneDamage: 1
        VeinsDamage: 1
        NerveDamage: 1
      modifiers:
        coefficients:
          Blunt: 0.1 # Best armor in the game - Yeah no shit.
          Slash: 0.1
          Piercing: 0.1
          Heat: 0.1
          Cold: 0.1
          Cellular: 0.1
          Radiation: 0
          Caustic: 0.1
    - type: ThermalVision
      isEquipment: true
      color: "#3f51b5"
