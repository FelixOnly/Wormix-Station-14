#Modsuit DHS

- type: entity
  parent: [ClothingModsuitStandard, BaseCentcommContraband]
  id: ClothingModsuitCorporateDHS
  name: контроллер ДВБ скафандра
  description: Модификация Корпоративного Модсюта.
  components:
    - type: Sprite
      sprite: /Textures/_Wormix/Clothing/corporatenavy.rsi
    - type: ToggleableClothing
      clothingPrototypes:
        head: ClothingModsuitHelmetCorporateDHS
        gloves: ClothingModsuitGauntletsCorporateDHS
        outerClothing: ClothingModsuitChestplateCorporateDHS
        shoes: ClothingModsuitBootsCorporateDHS
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellAntiqueProto
          whitelist:
            components:
              - PowerCell
    - type: Storage
      grid:
        - 0,0,7,6
    - type: ExplosionResistance
      damageCoefficient: 0.1
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        back:
          - state: equipped-BACKPACK-sealed
          - state: equipped-BACKPACK-sealed-unshaded
            shader: unshaded

