#Deathsquad Helmet
- type: entity
  parent: [BaseCentcommContraband, ClothingHeadHardsuitWithLightBase]
  id: ClothingHeadHelmetHardsuitDeathsquadAlpha
  suffix: Альфа
  name: шлем Эскадрона Смерти Альфа
  description: За этой маской нет человека, только намерение.
  components:
    - type: BreathMask
    - type: Sprite
      sprite: /Textures/_Wormix/Clothing/dq_alpha_helmet.rsi
    - type: Clothing
      sprite: /Textures/_Wormix/Clothing/dq_alpha_helmet.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.08
      lowPressureMultiplier: 1000
    - type: FireProtection
      reduction: 0
    - type: Armor
      traumaDeductions:
        Dismemberment: 1
        OrganDamage: 1
        BoneDamage: 1
        VeinsDamage: 1
        NerveDamage: 1
      modifiers:
        coefficients:
          Blunt: 0
          Slash: 0
          Piercing: 0
          Heat: 0
          Cold: 0
          Cellular: 0
          Radiation: 0
          Caustic: 0
    - type: FlashImmunity # Goobstation
    - type: FlashSoundSuppression # Goobstation
      protectionRange: 0
    - type: PointLight # Goobstation
      color: "#567fc4"
      rotation: 30
      energy: 10
      radius: 5
    - type: ThermalVision
      isEquipment: true
      color: "#98EEFB"
      lightRadius: 15
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag

