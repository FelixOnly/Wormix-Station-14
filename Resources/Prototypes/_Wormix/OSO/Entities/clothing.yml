- type: entity
  parent: [BaseCentcommContraband, ClothingShoesBootsJackFilled]
  name: подозрительные подкованные сапоги
  id: ClothingShoesBootsJackFilledOSO
  description: Нескользящая модификация ботинок, судя по всему они созданы для высокопоставленных офицеров Центком.
  suffix: ОСО
  components:
    - type: NoSlip
    - type: FootstepModifier
      footstepSoundCollection:
        collection: StepHeavyBoots

#SOO Mag

- type: entity
  parent: ClothingShoesBootsMagEmergencyResponseTeam
  id: ClothingShoesBootsOSO
  suffix: ОСО
  name: магнитные сапоги ОСО
  description: Подошвы впиваются в пол, чтобы каждый шаг был законом.
  components:
    - type: ContainerContainer
      containers:
        item: !type:ContainerSlot
    - type: Sprite
      sprite: /Textures/_Wormix/Clothes/OSOmag.rsi
      state: icon
    - type: Clothing
      sprite: /Textures/_Wormix/Clothes/OSOmag.rsi
    - type: Item
      sprite: /Textures/_Wormix/Clothes/OSOmag.rsi
    - type: ClothingSpeedModifier
      walkModifier: 1.10
      sprintModifier: 1.10
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepHeavySuit
    - type: GasTank
      outputPressure: 42.6
      air:
        volume: 50000
        temperature: 293.15
        moles:
          - 50000 # oxygen
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag
    - type: ItemSlots
      slots:
        item:
          whitelist:
            tags:
              - Knife
              - Sidearm
