#Deathsquad Webbing

- type: entity
  parent:
    [
      ClothingBeltStorageBase,
      ContentsExplosionResistanceBase,
      BaseCentcommContraband,
    ]
  id: ClothingBeltDeathsquadWebbing
  suffix: DO NOT MAP
  name: deathsquad operative chestrig
  description: A robust and durable chestrig, containing everything you need to keep you in the fight. You probably won't need to use it.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/Belt/deathsquadwebbing.rsi
    - type: Clothing
      sprite: _Goobstation/Clothing/Belt/deathsquadwebbing.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.01
    - type: ContainerContainer
      containers:
        item: !type:ContainerSlot
        storagebase: !type:Container
          ents: []
    - type: ItemSlots
      slots:
        item:
          # name: Handgun # CorvaxGoob-Loc-in-UI
          whitelist:
            tags:
              - Sidearm
        item2:
          whitelist:
            tags:
              - Special1

- type: entity
  parent: [ClothingBeltDeathsquadWebbing, BaseCentcommContraband]
  suffix: Filled, DO NOT MAP
