#PDA

- type: entity
  parent: CentcomPDA
  id: DHSBlackPDA
  name: КПК ДВБ
  description: Дьявол кроется в деталях.
  components:
    # Orion-Start
    - type: Sprite
      layers:
        - map: ["enum.PdaVisualLayers.Base"]
          state: pda_base
          color: "#FFD900"
        - state: pda_buttons
        - state: pda_stripe_split
          color: "#0C0C0C"
        - map: ["enum.PdaVisualLayers.Screen"]
          state: pda_screen_borders
        - state: light_overlay
          map: ["enum.PdaVisualLayers.Flashlight"]
          shader: unshaded
          visible: false
        - state: id_overlay
          map: ["enum.PdaVisualLayers.IdLight"]
          shader: unshaded
          visible: false
        - state: "insert_overlay" # Goob
          map: ["enum.PdaVisualLayers.Pen"]
    # Orion-End
    - type: PdaBorderColor
      borderColor: "#04040a" # Orion-Edit
      accentVColor: "#f3cf01" # Orion-Edit

- type: entity
  parent: DHSBlackPDA
  id: DHSCaptainBlackPDA
  name: КПК Капитана ДВБ
  description: Дьявол кроется в деталях.
  components:
    - type: Pda
      id: CentcomIDCardDHSCaptain

- type: entity
  parent: DHSBlackPDA
  id: SpecialOperationsOfficerPDA
  name: КПК Офицера СпецОпераций
  description: Дьявол кроется в деталях.
  components:
    - type: Pda
      id: CentcomIDCardSpecialOperationsOfficer

- type: entity
  parent: DHSBlackPDA
  id: DHSOfficerPDA
  name: КПК Офицера ДВБ
  description: Секретно.
  components:
    - type: Pda
      id: CentcomIDCardDHSOfficer

#ID Card

- type: entity
  parent: CentcomIDCardDHSCaptain
  id: CentcomIDCardSpecialOperationsOfficer
  name: Special Operations Officer's ID card
  components:
    - type: Sprite
      layers:
        - state: silver
        - state: idcentcom
    - type: Item
      heldPrefix: silver
    - type: PresetIdCard
      job: SpecialOperationsOfficer

- type: entity
  parent: IDCardStandard
  id: CentcomIDCardDHSCaptain
  name: DHS Captain's ID card
  components:
    - type: Sprite
      layers:
        - state: gold
        - state: idcentcom
    - type: Item
      heldPrefix: gold
    - type: PresetIdCard
      job: DHSCaptain

- type: entity
  parent: CentcomIDCardDHSCaptain
  id: CentcomIDCardDHSOfficer
  name: DHS Officer's ID card
  components:
    - type: Sprite
      sprite: Objects/Misc/id_cards.rsi
      layers:
        - state: ert_security
    - type: PresetIdCard
      job: DHSOfficer
