#Items

- type: entity
  name: тактическая аптечка
  description: "Тактическая аптечка с расширенным набором автоинжекторов и регенеративных средств. Потому что стандартная медицина просто не успевает за вашим образом жизни."
  parent: Medkit
  id: MedkitMilitary
  components:
  - type: Sprite
    sprite: /Textures/_Wormix/Objects/Misc/medkit.rsi
    state: blackkit
  - type: Item
    heldPrefix: blackkit
    size: Normal
    shape:
    - 0,0,1,1
    sprite: /Textures/_Wormix/Objects/Misc/medkit.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,3  
  - type: StaticPrice
    price: 900

