- type: entity
  id: DefibrillatorCompactDeathSquad
  parent: [ BaseDefibrillator, PowerCellSlotMediumItem ]
  name: дефибриллятор Эскадрона Смерти
  description: Спасение жизни ещё никогда не было таким агрессивным.
  components:
  - type: Sprite
    sprite: /Textures/_Wormix/Objects/Misc/defibdeathsquad.rsi
    layers:
      - state: icon
      - state: screen
        map: [ "enum.ToggleableVisuals.Layer" ]
        visible: false
        shader: unshaded
      - state: ready
        map: ["enum.PowerDeviceVisualLayers.Powered"]
        shader: unshaded
  - type: Item
    size: Small
  - type: ToggleCellDraw
  - type: PowerCellDraw
    useRate: 50
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -70
        Poison: -50
        Radiation: -50
        Blunt: -50
        Slash: -50
        Piercing: -50
        Heat: -55
        Cold: -50
        Caustic: -50
        Shock: -50
        Cellular: -10
    doAfterDuration: 3 # Goob value
  - type: DoAfter
  - type: UseDelay
  - type: ContainerFill
    containers:
      cell_slot:
      - PowerCellMicroreactor
  - type: Tag
    tags:
    - Special1
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Items/Defib/defib_zap.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Items/Defib/defib_zap.ogg
      params:
        variation: 0.250
        volume: -10
    activatedDamage:
      types:
        Blunt: 15
        Shock: 30
      
- type: entity
  parent: [ OmnimedTool, BaseCentcommContraband ]
  id: OmnimedToolDeathSquad
