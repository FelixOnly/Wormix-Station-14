- type: entity
  id: BaseFelixGasMask
  parent: ClothingMaskGas
  name: gas mask
  description: A face-covering mask that can be connected to an air supply.
  abstract: true
  components:
    - type: Sprite
      sprite: Imperial/DeadSector/masks/G100Y.rsi
    - type: Clothing
      sprite: Imperial/DeadSector/masks/G100Y.rsi
    - type: BreathMask
    - type: RadiationReceiver
    - type: Armor
      modifiers:
        coefficients:
          Heat: 0.95
          Radiation: 0.65

